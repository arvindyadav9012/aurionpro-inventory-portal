<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LaurionPro - NMRC Inventory Portal</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100">
<header class="bg-slate-900 text-white p-4 flex justify-between items-center">
<div><h1 class="text-xl font-extrabold">LaurionPro / AurionPro - NMRC Portal</h1><p class="text-xs text-slate-400">Prepared by Arvind Yadav - Depot Inventory System</p></div>
<button onclick="exportExcel()" class="bg-emerald-500 px-4 py-2 rounded font-bold text-sm">Export Excel</button>
</header>
<div class="max-w-7xl mx-auto p-4 grid grid-cols-4 gap-4 mt-4">
<div class="bg-white p-4 rounded-xl shadow border-l-4 border-red-500"><p class="text-xs">Total Failures</p><h2 id="statFail" class="text-2xl font-bold">0</h2></div>
<div class="bg-white p-4 rounded-xl shadow border-l-4 border-blue-500"><p class="text-xs">Inspections</p><h2 id="statInsp" class="text-2xl font-bold">0</h2></div>
<div class="bg-white p-4 rounded-xl shadow border-l-4 border-amber-500"><p class="text-xs">Roll Stock</p><h2 id="statRoll" class="text-2xl font-bold">0</h2></div>
<div class="bg-white p-4 rounded-xl shadow border-l-4 border-green-500"><p class="text-xs">Materials</p><h2 id="statMat" class="text-2xl font-bold">0</h2></div>
</div>
<div class="max-w-7xl mx-auto p-4 grid grid-cols-1 lg:grid-cols-3 gap-6">
<div class="bg-white p-5 rounded-xl shadow">
<h3 class="font-bold mb-3">+ Failure Entry</h3>
<input id="fDate" type="date" class="w-full border p-2 rounded mb-2">
<select id="fType" class="w-full border p-2 rounded mb-2"><option>AFC Gate Failure</option><option>PSD Door Failure</option><option>ECD / EFO Failure</option><option>Reader / Validator</option><option>Network Issue</option></select>
<input id="fStation" placeholder="Station Name" class="w-full border p-2 rounded mb-2">
<input id="fDesc" placeholder="Description" class="w-full border p-2 rounded mb-2">
<button onclick="addFailure()" class="w-full bg-slate-900 text-white py-2 rounded font-bold">Add Failure</button>
</div>
<div class="bg-white p-5 rounded-xl shadow">
<h3 class="font-bold mb-3">+ Inspection Entry</h3>
<input id="iDate" type="date" class="w-full border p-2 rounded mb-2">
<input id="iStation" placeholder="Station" class="w-full border p-2 rounded mb-2">
<input id="iBy" placeholder="Inspected By" class="w-full border p-2 rounded mb-2">
<select id="iStatus" class="w-full border p-2 rounded mb-2"><option>OK</option><option>Needs Maintenance</option><option>Failed</option></select>
<button onclick="addInspection()" class="w-full bg-blue-600 text-white py-2 rounded font-bold">Add Inspection</button>
</div>
<div class="bg-white p-5 rounded-xl shadow">
<h3 class="font-bold mb-3">+ Roll / Material Stock</h3>
<select id="rType" class="w-full border p-2 rounded mb-2"><option>Roll - 350M Thermal Paper</option><option>Roll - 200M</option><option>QR Ticket Roll</option><option>Cleaning Card</option><option>Spare Part</option></select>
<input id="rQty" type="number" placeholder="Quantity +/-" class="w-full border p-2 rounded mb-2">
<input id="rStation" placeholder="Depot / Station" class="w-full border p-2 rounded mb-2">
<button onclick="addRoll()" class="w-full bg-amber-500 text-white py-2 rounded font-bold">Update Stock</button>
<hr class="my-3">
<input id="mName" placeholder="Material Name" class="w-full border p-2 rounded mb-2">
<input id="mQty" type="number" placeholder="Qty" class="w-full border p-2 rounded mb-2">
<button onclick="addMaterial()" class="w-full bg-emerald-600 text-white py-2 rounded font-bold">Add Material</button>
</div>
</div>
<div class="max-w-7xl mx-auto p-4 bg-white rounded-xl shadow mt-4">
<div class="flex justify-between items-center mb-3"><h3 class="font-bold">Recent Logs</h3><input id="search" onkeyup="render()" placeholder="Search..." class="border p-2 rounded w-48 text-sm"></div>
<div class="overflow-x-auto"><table class="w-full text-sm"><thead class="bg-slate-100"><tr><th class="p-2 text-left">Date</th><th class="p-2 text-left">Category</th><th class="p-2 text-left">Details</th><th class="p-2 text-left">Station</th><th class="p-2">Del</th></tr></thead><tbody id="tbody"></tbody></table></div>
</div>
<script>
let data=JSON.parse(localStorage.getItem('nmrc_final_v2')||'[]');
function save(){localStorage.setItem('nmrc_final_v2',JSON.stringify(data));render();}
function addFailure(){if(!fDate.value||!fStation.value)return alert('Date & Station required');data.unshift({id:Date.now(),date:fDate.value,cat:'FAILURE',type:fType.value,detail:fDesc.value,station:fStation.value});save();fStation.value='';fDesc.value='';}
function addInspection(){if(!iDate.value||!iStation.value)return alert('Required');data.unshift({id:Date.now(),date:iDate.value,cat:'INSPECTION',type:iStatus.value,detail:'By:'+iBy.value,station:iStation.value});save();}
function addRoll(){if(!rQty.value)return alert('Qty required');data.unshift({id:Date.now(),date:new Date().toISOString().slice(0,10),cat:'ROLL',type:rType.value,detail:'Qty:'+rQty.value,station:rStation.value});save();}
function addMaterial(){if(!mName.value)return alert('Name required');data.unshift({id:Date.now(),date:new Date().toISOString().slice(0,10),cat:'MATERIAL',type:mName.value,detail:'Qty:'+mQty.value,station:'Main Depot'});save();mName.value='';mQty.value='';}
function render(){let q=(document.getElementById('search').value||'').toLowerCase();let f=data.filter(d=>(d.station+d.type+d.cat).toLowerCase().includes(q));document.getElementById('tbody').innerHTML=f.map(d=>`<tr class="border-t"><td class="p-2">${d.date}</td><td class="p-2">${d.cat}</td><td class="p-2">${d.type} - ${d.detail}</td><td class="p-2">${d.station}</td><td class="p-2 text-center"><button onclick="del(${d.id})" class="text-red-500">X</button></td></tr>`).join('');document.getElementById('statFail').innerText=data.filter(d=>d.cat=='FAILURE').length;document.getElementById('statInsp').innerText=data.filter(d=>d.cat=='INSPECTION').length;document.getElementById('statRoll').innerText=data.filter(d=>d.cat=='ROLL').length;document.getElementById('statMat').innerText=data.filter(d=>d.cat=='MATERIAL').length;}
function del(id){data=data.filter(d=>d.id!=id);save();}
function exportExcel(){let csv='Date,Category,Type,Detail,Station\n'+data.map(d=>`${d.date},${d.cat},"${d.type}","${d.detail}",${d.station}`).join('\n');let blob=new Blob([csv],{type:'text/csv'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='NMRC_Report_'+new Date().toISOString().slice(0,10)+'.csv';a.click();}
render();document.getElementById('fDate').valueAsDate=new Date();document.getElementById('iDate').valueAsDate=new Date();
</script>
</body>
</html>
